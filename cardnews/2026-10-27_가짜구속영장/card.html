<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가짜 구속영장 카드뉴스</title>
<style>
  @font-face { font-family: "NotoKR"; font-weight: 500; src: url(fonts/noto-sans-kr-latin-500-normal.woff2); }
  @font-face { font-family: "NotoKR"; font-weight: 500; src: url(fonts/noto-sans-kr-korean-500-normal.woff2); unicode-range: U+AC00-D7A3, U+3131-318E, U+1100-11FF, U+2018-201D, U+2026; }
  @font-face { font-family: "NotoKR"; font-weight: 800; src: url(fonts/noto-sans-kr-latin-800-normal.woff2); }
  @font-face { font-family: "NotoKR"; font-weight: 800; src: url(fonts/noto-sans-kr-korean-800-normal.woff2); unicode-range: U+AC00-D7A3, U+3131-318E, U+1100-11FF, U+2018-201D, U+2026; }
  @font-face { font-family: "NotoKR"; font-weight: 900; src: url(fonts/noto-sans-kr-latin-900-normal.woff2); }
  @font-face { font-family: "NotoKR"; font-weight: 900; src: url(fonts/noto-sans-kr-korean-900-normal.woff2); unicode-range: U+AC00-D7A3, U+3131-318E, U+1100-11FF, U+2018-201D, U+2026; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: #0f1115; }
  body { font-family: "NotoKR", "WenQuanYi Zen Hei", sans-serif; color: #fff; overflow: hidden; }

  .card { position: relative; width: 1080px; height: 1350px; }

  /* 상단 65%: 사진 영역 (?photo= 로 힉스필드 이미지 교체) */
  .photo {
    position: absolute; inset: 0 0 auto 0; height: 880px; overflow: hidden;
    background: radial-gradient(circle at 30% 35%, #4a2a2e 0%, #24171b 50%, #12161d 100%);
  }
  .photo.has-image { background-size: cover; background-position: center; }

  /* 기본 일러스트: 스마트폰 화면 속 가짜 구속영장 */
  .phone {
    position: absolute; left: 290px; top: 120px; width: 500px; height: 860px;
    background: #111; border-radius: 64px; padding: 22px;
    box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 3px #2c2c2c;
    transform: rotate(6deg);
  }
  .screen { width: 100%; height: 100%; border-radius: 46px; background: #fbfaf7; color: #1d1d1d; overflow: hidden; position: relative; }
  .sms { margin: 34px 26px 0; background: #e9e9ee; border-radius: 22px; padding: 18px 22px; font-size: 22px; font-weight: 500; line-height: 1.45; color: #333; }
  .sms u { color: #2a62d9; }
  .warrant { margin: 26px 26px 0; border: 3px solid #1d1d1d; padding: 26px 24px; position: relative; }
  .warrant h4 { text-align: center; font-weight: 900; font-size: 50px; letter-spacing: 12px; }
  .warrant .org { text-align: center; font-weight: 500; font-size: 20px; color: #666; margin-top: 4px; }
  .warrant .line { display: flex; gap: 14px; font-size: 24px; font-weight: 500; margin-top: 18px; }
  .warrant .line b { font-weight: 900; }
  .warrant .name { background: #fff2a8; padding: 0 6px; }
  .seal {
    position: absolute; right: 18px; bottom: 16px; width: 92px; height: 92px; border-radius: 50%;
    border: 5px solid #d3302a; color: #d3302a; font-weight: 900; font-size: 22px;
    display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.1; transform: rotate(-14deg);
  }
  .fake {
    position: absolute; left: 40px; top: 600px;
    border: 9px solid #e0342b; color: #e0342b; background: rgba(255,255,255,.88);
    font-weight: 900; font-size: 80px; padding: 0 26px; border-radius: 14px;
    transform: rotate(-14deg); letter-spacing: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  .fade { position: absolute; left: 0; right: 0; top: 680px; height: 220px; background: linear-gradient(to bottom, rgba(15,17,21,0), #0f1115); }

  .tag { position: absolute; left: 64px; top: 56px; background: #e0342b; color: #fff; font-weight: 900; font-size: 34px; padding: 10px 24px; border-radius: 8px; }
  .handle { position: absolute; right: 64px; top: 64px; font-weight: 800; font-size: 28px; color: rgba(255,255,255,.85); }

  .title { position: absolute; left: 64px; right: 64px; top: 905px; }
  .title p { white-space: nowrap; font-weight: 900; font-size: 84px; line-height: 1.22; letter-spacing: -4px; }
  .title p:first-child { font-size: 78px; font-weight: 800; color: #e9e9e9; letter-spacing: -3px; }
  .hl { color: #ffd23f; }
  .title p.l2 { font-size: 80px; letter-spacing: -4.5px; }

  .meta { position: absolute; left: 64px; right: 64px; bottom: 54px; display: flex; justify-content: space-between; font-weight: 500; font-size: 26px; color: #9aa3b2; }
</style>
</head>
<body>
<div class="card">
  <div class="photo" id="photo">
    <div id="illust">
      <div class="phone"><div class="screen">
        <div class="sms">[등기우편 반송] 수신 확인이 안 되어 연락드립니다. 아래 주소에서 성함 입력 후 확인 바랍니다.<br><u>http://xxx-post.kr</u></div>
        <div class="warrant">
          <h4>구속영장</h4>
          <div class="org">○○지방검찰청</div>
          <div class="line"><span>피의자</span><b class="name">홍 길 동</b></div>
          <div class="line"><span>죄&nbsp;&nbsp;&nbsp;명</span><b>금융범죄 연루</b></div>
          <div class="line"><span>조&nbsp;&nbsp;&nbsp;치</span><b>재산 검사 필요</b></div>
          <div class="seal">검사<br>직인</div>
        </div>
      </div></div>
      <div class="fake">가짜</div>
    </div>
  </div>
  <div class="fade"></div>
  <div class="tag">경찰 발표</div>
  <div class="handle">@acesamdole2</div>

  <div class="title">
    <p>문자 속 링크에 이름 넣자</p>
    <p class="l2">가짜 구속영장… <span class="hl">31억</span> 털렸다</p>
  </div>

  <div class="meta"><span>출처: 세종경찰청 발표(뉴스1·서울신문 등)</span><span>2026.10.26 보도</span></div>
</div>
<script>
  // ?photo=파일경로 로 힉스필드 이미지를 넣으면 일러스트 대신 사진이 들어갑니다.
  const p = new URLSearchParams(location.search).get("photo");
  if (p) {
    const el = document.getElementById("photo");
    el.classList.add("has-image");
    el.style.backgroundImage = `url("${p}")`;
    document.getElementById("illust").remove();
  }
</script>
</body>
</html>
